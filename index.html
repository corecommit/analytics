<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Gateway</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #3b82f6; margin-bottom: 0.5rem; font-size: 1.7rem; }
        p { color: #9ca3af; font-size: 0.95rem; line-height: 1.5; }
        .status {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>System Active</h1>
        <p>Your regional routing information is processed and cataloged securely via serverless infrastructure.</p>
        <div id="status" class="status">Connecting...</div>
    </div>

    <script>
        // Trigger the background logging API
        fetch('/api/config-sync')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('status').innerText = `Logged: ${data.ip} (${data.location})`;
                } else {
                    document.getElementById('status').innerText = 'Handshake verified.';
                }
            })
            .catch(() => {
                document.getElementById('status').innerText = 'Connection established.';
            });
    </script>
</body>
</html>
