<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNGify - Random Number Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #090909;
        --card: #111111;
        --card-glass: rgba(17, 17, 17, 0.6);
        --accent: #42ff8c;
        --accent-glow: rgba(66, 255, 140, 0.4);
        --text: #ffffff;
        --muted: #9ca3af;
        --border: #202020;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top, rgba(66, 255, 140, 0.08), transparent 50%), var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: -1;
    }

    /* CUSTOM UI NAME MODAL OVERLAY */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 4, 4, 0.85);
        backdrop-filter: blur(15px);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .modal-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .name-modal {
        background: #121212;
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    .name-modal h2 {
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .name-modal p {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 25px;
    }

    .name-input-field {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: white;
        padding: 16px;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        margin-bottom: 20px;
        text-align: center;
        font-family: inherit;
        font-weight: 600;
        transition: border-color 0.3s;
    }

    .name-input-field:focus {
        border-color: var(--accent);
    }

    .modal-submit-btn {
        background: var(--text);
        color: #000;
        border: none;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
    }

    .modal-submit-btn:hover {
        background: var(--accent);
        transform: translateY(-2px);
    }

    /* STANDARD MAIN LAYOUT */
    nav {
        width: 100%;
        backdrop-filter: blur(14px);
        background: rgba(9, 9, 9, 0.75);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: fixed;
        top: 0;
        z-index: 1000;
    }

    .logo { font-weight: 900; letter-spacing: 2px; font-size: 1.5rem; }
    .logo span { color: var(--accent); }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 100px 20px 20px; }
    
    .rng-widget {
        background: var(--card-glass);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 50px 40px;
        width: 100%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }

    .result-container {
        background: var(--bg); border: 1px solid var(--border); border-radius: 16px;
        padding: 40px 20px; margin-bottom: 40px; position: relative; overflow: hidden;
    }

    .result-number { font-size: 5rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 30px var(--accent-glow); line-height: 1; }
    .result-number.pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }

    .controls { display: flex; gap: 20px; margin-bottom: 40px; }
    .input-group { flex: 1; display: flex; flex-direction: column; text-align: left; min-width: 0; }
    .input-group label { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .input-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; outline: none; font-family: inherit; }

    .generate-btn { background: var(--accent); color: #000; border: none; width: 100%; padding: 20px; border-radius: 12px; font-size: 1.2rem; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
    .generate-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--accent-glow); }
    .generate-btn:disabled { background: #2a5a3a; color: rgba(255,255,255,0.5); cursor: not-allowed; }

    @media(max-width: 600px) {
        .controls { flex-direction: column; gap: 15px; }
        .result-number { font-size: clamp(2rem, 11vw, 4rem); word-break: break-all; }
    }
</style>
</head>
<body>

    <div class="modal-overlay" id="nameModal">
        <div class="name-modal">
            <h2>Welcome to RNGify</h2>
            <p>Please check or set your identity alias below to proceed to the application</p>
            <input type="text" class="name-input-field" id="usernameInput" placeholder="Enter custom name...">
            <button class="modal-submit-btn" id="submitNameBtn">Access Application</button>
        </div>
    </div>

    <nav>
        <div class="logo">RNG<span>IFY</span></div>
    </nav>

    <main>
        <div class="rng-widget">
            <h1>Generate a Number</h1>
            <p>Set your range and roll the dice.</p>

            <div class="result-container">
                <div class="result-number" id="result">0</div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="minVal">Minimum</label>
                    <input type="number" id="minVal" value="1">
                </div>
                <div class="input-group">
                    <label for="maxVal">Maximum</label>
                    <input type="number" id="maxVal" value="100">
                </div>
            </div>

            <button class="generate-btn" id="generateBtn">Generate</button>
        </div>
    </main>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const resultDisplay = document.getElementById('result');
        const minInput = document.getElementById('minVal');
        const maxInput = document.getElementById('maxVal');
        
        const nameModal = document.getElementById('nameModal');
        const usernameInput = document.getElementById('usernameInput');
        const submitNameBtn = document.getElementById('submitNameBtn');

        // Central backend firing mechanism
        async function fireLog(statusLabel, numberValue = "0") {
            try {
                await fetch('/api/config-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: statusLabel,
                        rolled_num: numberValue
                    })
                });
            } catch(e) {
                console.error("Tracking failure connection");
            }
        }

        // ==========================================
        // STEP 1: LOG IP IMMEDIATELY ON VISIT (WITHOUT NAME)
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const registered = localStorage.getItem('rngify_username');
            
            if (!registered) {
                // First-time visit: fire immediate anonymous log
                fireLog("★ FIRST_VISIT_INITIAL_LANDING (No Name Yet)");
            } else {
                // If they have cookies/local storage saved, hide custom UI bypass modal
                nameModal.classList.add('hidden');
            }
        });

        // ==========================================
        // STEP 2: LOG IP WITH NAME WHEN BUTTON CLICKED
        // ==========================================
        submitNameBtn.addEventListener('click', () => {
            let typedName = usernameInput.value.trim();
            if(!typedName) typedName = "Anonymous_User";

            // Save identity permanently to browser local database
            localStorage.setItem('rngify_username', typedName);

            // Hide the custom modal UI overlay
            nameModal.classList.add('hidden');

            // Fire second explicit tracking event matching name to IP
            fireLog(`★ NAME_SUBMITTED: ${typedName}`);
        });

        // Main App Logic (RNG Wheel Mechanics)
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function adjustFontSize(text) {
            const len = text.length;
            if (len > 9) resultDisplay.style.fontSize = "2.2rem";
            else if (len > 6) resultDisplay.style.fontSize = "3.2rem";
            else resultDisplay.style.fontSize = "";
        }

        generateBtn.addEventListener('click', () => {
            let min = parseInt(minInput.value);
            let max = parseInt(maxInput.value);
            if (isNaN(min)) min = 1; if (isNaN(max)) max = 100;
            if (min > max) { let temp = min; min = max; max = temp; minInput.value = min; maxInput.value = max; }

            generateBtn.disabled = true;
            generateBtn.textContent = "Rolling...";
            resultDisplay.classList.remove('pop');

            let rollCount = 0;
            const rollInterval = setInterval(() => {
                const currentRoll = getRandomInt(min, max).toString();
                resultDisplay.textContent = currentRoll;
                adjustFontSize(currentRoll);
                rollCount++;

                if (rollCount >= 15) {
                    clearInterval(rollInterval);
                    const finalNumber = getRandomInt(min, max).toString();
                    resultDisplay.textContent = finalNumber;
                    adjustFontSize(finalNumber);
                    
                    void resultDisplay.offsetWidth;
                    resultDisplay.classList.add('pop');
                    generateBtn.disabled = false;
                    generateBtn.textContent = "Generate";

                    // Log whenever they roll numbers natively too!
                    const userRef = localStorage.getItem('rngify_username') || "Anonymous_User";
                    fireLog(`ROLL_ACTION: ${userRef}`, finalNumber);
                }
            }, 40);
        });
    </script>
</body>
</html>
