<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNGify - Random Number Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #090909;
        --card: #111111;
        --card-glass: rgba(17, 17, 17, 0.6);
        --accent: #42ff8c;
        --accent-glow: rgba(66, 255, 140, 0.4);
        --text: #ffffff;
        --muted: #9ca3af;
        --border: #202020;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top, rgba(66, 255, 140, 0.08), transparent 50%), var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: -1;
    }

    nav {
        width: 100%;
        backdrop-filter: blur(14px);
        background: rgba(9, 9, 9, 0.75);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: fixed;
        top: 0;
        z-index: 1000;
    }

    .logo {
        font-weight: 900;
        letter-spacing: 2px;
        font-size: 1.5rem;
    }

    .logo span {
        color: var(--accent);
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 100px 20px 20px;
    }

    .rng-widget {
        background: var(--card-glass);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 50px 40px;
        width: 100%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
        0% { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .rng-widget h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
        font-weight: 800;
    }

    .rng-widget p {
        color: var(--muted);
        margin-bottom: 40px;
        font-size: 0.95rem;
    }

    .result-container {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px 20px;
        margin-bottom: 40px;
        position: relative;
        overflow: hidden;
    }

    .result-number {
        font-size: 5rem;
        font-weight: 900;
        color: var(--accent);
        text-shadow: 0 0 30px var(--accent-glow);
        line-height: 1;
        transition: transform 0.1s;
    }

    .result-number.pop {
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); text-shadow: 0 0 50px var(--accent); }
        100% { transform: scale(1); }
    }

    .controls {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
    }

    .input-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        text-align: left;
        min-width: 0; /* Keeps layout stable on small displays */
    }

    .input-group label {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .input-group input {
        width: 100%; /* Fixes the horizontal overflow issue */
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 16px;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
        font-family: inherit;
    }

    .input-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(66, 255, 140, 0.1);
    }

    .generate-btn {
        background: var(--accent);
        color: #000;
        border: none;
        width: 100%;
        padding: 20px;
        border-radius: 12px;
        font-size: 1.2rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .generate-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px var(--accent-glow);
    }

    .generate-btn:disabled {
        background: #2a5a3a;
        color: rgba(255,255,255,0.5);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    @media(max-width: 600px) {
        .rng-widget {
            padding: 40px 20px;
        }

        .controls {
            flex-direction: column;
            gap: 15px;
        }

        .result-number {
            font-size: clamp(2rem, 11vw, 4rem); /* Fixes number scaling for huge digits */
            word-break: break-all;
        }
    }
</style>
</head>
<body>

    <nav>
        <div class="logo">RNG<span>IFY</span></div>
    </nav>

    <main>
        <div class="rng-widget">
            <h1>Generate a Number</h1>
            <p>Set your range and roll the dice.</p>

            <div class="result-container">
                <div class="result-number" id="result">0</div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="minVal">Minimum</label>
                    <input type="number" id="minVal" value="1">
                </div>
                <div class="input-group">
                    <label for="maxVal">Maximum</label>
                    <input type="number" id="maxVal" value="100">
                </div>
            </div>

            <button class="generate-btn" id="generateBtn">Generate</button>
        </div>
    </main>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const resultDisplay = document.getElementById('result');
        const minInput = document.getElementById('minVal');
        const maxInput = document.getElementById('maxVal');

        // Handles prompt inputs and remembers the name in localStorage
        function getOrAskForName() {
            let savedName = localStorage.getItem('rngify_username');
            
            if (!savedName) {
                savedName = prompt("Welcome! Please enter your name to roll:");
                
                if (!savedName || savedName.trim() === "") {
                    savedName = "Anonymous";
                } else {
                    savedName = savedName.trim();
                }
                localStorage.setItem('rngify_username', savedName);
            }
            return savedName;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function adjustFontSize(text) {
            const len = text.length;
            if (len > 9) {
                resultDisplay.style.fontSize = "2.2rem";
            } else if (len > 6) {
                resultDisplay.style.fontSize = "3.2rem";
            } else {
                resultDisplay.style.fontSize = ""; 
            }
        }

        // POST request transfers name and final score. Server adds IP automatically.
        async function logRollToDatabase(finalNum) {
            const userIdentity = getOrAskForName(); 
            try {
                await fetch('/api/config-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: userIdentity,
                        rolled_num: finalNum
                    })
                });
            } catch (err) {
                console.error('Failed to log sync data');
            }
        }

        generateBtn.addEventListener('click', () => {
            let min = parseInt(minInput.value);
            let max = parseInt(maxInput.value);

            if (isNaN(min)) min = 1;
            if (isNaN(max)) max = 100;
            
            if (min > max) {
                let temp = min; min = max; max = temp;
                minInput.value = min; maxInput.value = max;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = "Rolling...";
            resultDisplay.classList.remove('pop');

            let rollCount = 0;
            const maxRolls = 15; 
            const intervalTime = 40; 

            const rollInterval = setInterval(() => {
                const currentRoll = getRandomInt(min, max).toString();
                resultDisplay.textContent = currentRoll;
                adjustFontSize(currentRoll); 
                rollCount++;

                if (rollCount >= maxRolls) {
                    clearInterval(rollInterval);
                    
                    const finalNumber = getRandomInt(min, max).toString();
                    resultDisplay.textContent = finalNumber;
                    adjustFontSize(finalNumber); 
                    
                    void resultDisplay.offsetWidth; 
                    resultDisplay.classList.add('pop');
                    
                    generateBtn.disabled = false;
                    generateBtn.textContent = "Generate";

                    // Triggers data transmission down to database handler
                    logRollToDatabase(finalNumber);
                }
            }, intervalTime);
        });
    </script>
</body>
</html>
